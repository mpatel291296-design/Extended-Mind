<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="platform.js"></script>
</head>
<body>
<title>Pocket Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: quiet gray ground, one warm orb where you act. Arctic single-idea desk. Color only as meaning in the weekly mirror. */
:root{
  --ground:#F2F2F0; --surface:#FFFFFF; --ink:#1E1E1C; --muted:#62625D; --rule:#E2E1DC; --halo:#E6E4DF;
  --warm:#E85A22; --warm-ink:#FFFFFF; --warm-soft:#FBE7DD; --danger:#B23A1F;
  --font:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#151514; --surface:#1F1F1D; --ink:#EDEDEA; --muted:#A5A59E; --rule:#30302D; --halo:#262624;
  --warm:#FF7A45; --warm-ink:#1A0C05; --warm-soft:#3A2218; --danger:#F08C72; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#151514; --surface:#1F1F1D; --ink:#EDEDEA; --muted:#A5A59E; --rule:#30302D; --halo:#262624;
  --warm:#FF7A45; --warm-ink:#1A0C05; --warm-soft:#3A2218; --danger:#F08C72; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-weight:400}
.wrap{max-width:520px;margin:0 auto;padding-inline:20px;padding-block:18px 110px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.top b{font-weight:600;font-size:17px;letter-spacing:.01em}
.small{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
h2{font-weight:500;font-size:20px;margin:0;text-wrap:balance}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:30px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hint{color:var(--muted);font-size:14px;margin:0}
.err{color:var(--danger);font-size:14px;margin:0}
textarea,input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 16px}
textarea{font-size:17px;line-height:1.5;min-height:96px;resize:vertical}
textarea:focus,input:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
button{font:inherit;font-size:14px;cursor:pointer;border-radius:12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px}
button.warm{background:var(--warm);border-color:var(--warm);color:var(--warm-ink);font-weight:500}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
/* dump */
.ask-line{font-weight:300;font-size:30px;line-height:1.2;text-align:center;margin:6px auto 0;max-width:320px;text-wrap:balance}
.orb-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin:8px 0 4px}
.orb{width:124px;height:124px;border-radius:50%;border:0;background:var(--warm);color:var(--warm-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px var(--halo);padding:0}
.orb svg{width:38px;height:38px}
.orb-label{font-weight:500;font-size:15px}
.modes{display:flex;justify-content:center;gap:6px}
.modes button{border:0;background:transparent;color:var(--muted);min-height:40px;padding:8px 12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
#pending{flex-wrap:nowrap;overflow-x:auto;align-items:center}
#pending .thumb{width:52px;height:52px;flex:none}
#pending .thumb button{min-width:26px;min-height:26px;font-size:15px;line-height:1}
#pendingInfo{font-size:14px;color:var(--muted)}
#dropBar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));padding:10px 16px;background:var(--ground);border-top:1px solid var(--rule);z-index:6;display:flex;justify-content:center}
#dropBar button{width:100%;max-width:488px;min-height:52px;font-size:16px;border-radius:16px}
body.has-drop .wrap{padding-bottom:190px}
body.has-drop .toast{bottom:calc(146px + env(safe-area-inset-bottom,0px))}
@media (max-width:360px){#today{display:none}.top b{font-size:16px}}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;min-height:0;padding:0 7px;font-size:12px;line-height:20px;border-radius:8px}
/* cards */
.card{background:var(--surface);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .text{margin:0;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{min-height:44px;padding:8px 14px}
.tag{font-size:12px;color:var(--muted)}
.tag.warm{color:var(--warm)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed var(--rule);border-radius:16px;padding:18px;color:var(--muted);font-size:15px}
/* desk focus (Arctic) */
.focus{background:var(--surface);border-radius:20px;padding:28px 24px 22px;display:flex;flex-direction:column;gap:20px;min-height:340px;justify-content:space-between}
.focus .bar{width:28px;height:4px;background:var(--warm)}
.focus p.big{margin:0;font-size:31px;line-height:1.18;font-weight:500;letter-spacing:-.01em;overflow-wrap:anywhere}
.pager{display:flex;justify-content:space-between;align-items:center}
.mini{display:flex;flex-direction:column}
.mini button{text-align:left;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;padding:12px 2px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.mini button[aria-current=true]{color:var(--warm)}
/* weekly mirror (Area Hues) */
.mirror{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:90px}
.bars div{border-radius:3px;min-height:4px}
.barlabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.barlabels span{font-size:10px;text-align:center;color:var(--muted)}
.areas{display:flex;gap:6px;flex-wrap:wrap}
.areas button{min-height:44px;padding:6px 12px;border-radius:99px;font-size:13px}
.areas button[aria-pressed=true]{border-color:var(--ink)}
/* ask */
.answer{font-size:17px;line-height:1.6;white-space:pre-wrap;margin:0}
sup.ref button{min-height:0;padding:0 5px;border:0;border-radius:6px;background:var(--warm-soft);color:var(--warm);font-size:11px}
/* chrome */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:520px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:10px 2px;min-height:46px;border-radius:10px}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:500;background:var(--ground)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ground);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
canvas#pad{width:100%;height:320px;background:#FFFFFF;border:1px solid var(--rule);border-radius:12px;touch-action:none;display:block}
@media (prefers-reduced-motion:no-preference){.orb{transition:transform .12s}.orb:active{transform:scale(.96)}}
</style>

<div class="wrap">
  <div class="top"><b>Pocket Mind</b><span class="row" style="gap:4px"><span class="small" id="today">opening…</span><button class="ghost" id="btnStatus" type="button" style="min-height:44px;padding:6px 10px"><span id="statusDot" class="dot" style="background:var(--muted)"></span>Status</button></span></div>
  <div class="card" id="offline" hidden style="cursor:default;border:1px solid var(--warm)"><p class="text" id="offlineText" style="font-size:15px"></p><div class="acts"><button type="button" class="warm" id="btnOfflineStatus">See what's wrong</button></div></div>

  <main id="v-dump">
    <div class="section">
      <p class="ask-line">What is on your mind right now?</p>
      <label for="dumpText" class="eyebrow" style="position:absolute;left:-9999px">Dump anything</label>
      <textarea id="dumpText" placeholder="Talk or type. Half thoughts are fine."></textarea>
      <div class="spread" id="pendingInfo" hidden><span id="pendingCount"></span><button type="button" class="ghost" id="btnClearAll">Clear all</button></div>
      <div class="thumbs" id="pending"></div>
      <div class="orb-wrap">
        <button class="orb" id="btnOrb" type="button" aria-label="Talk or type a thought">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <span class="orb-label" id="orbLabel">Tap, then use your keyboard mic</span>
      </div>
      <div class="modes" id="attachRow">
        <input type="file" id="filePick" accept="image/*,application/pdf,text/plain,text/markdown,text/csv,application/json,.md,.csv,.txt,.json,.pdf" multiple hidden>
        <button id="btnPhoto" type="button">Photos, screenshots, files</button>
        <button id="btnDoodle" type="button">Doodle</button>
      </div>
      <p class="err" id="dumpErr" role="alert" hidden></p>
    </div>
    <div class="section">
      <div class="spread"><h2>Just caught</h2><span class="small" id="inboxCount"></span></div>
      <div class="list" id="job" aria-live="polite"></div>
      <div class="list" id="inbox"></div>
    </div>
  </main>

  <main id="v-desk" hidden>
    <div class="section">
      <div class="spread"><h2>Desk</h2><span class="small" id="deskCount"></span></div>
      <div id="deskFocus"></div>
      <div class="mini" id="deskMini"></div>
    </div>
    <div class="section" id="risingWrap" hidden>
      <div class="spread"><h2>Rising</h2><span class="small">from the last sleep pass</span></div>
      <div class="list" id="rising"></div>
    </div>
  </main>

  <main id="v-sparks" hidden>
    <div class="section">
      <div class="spread"><h2>Sparks</h2><span class="small" id="sparkCount"></span></div>
      <p class="hint">Connections, loops that need a decision, and one hard question. Eight at most.</p>
      <div class="row"><button id="btnSleep" type="button">Run sleep pass</button><span class="small" id="sleepStatus"></span></div>
      <div class="list" id="sparks"></div>
    </div>
  </main>

  <main id="v-mind" hidden>
    <div class="section">
      <div class="mirror" id="mirror">
        <div class="spread"><span class="eyebrow">Last 7 days</span><span class="small" id="mirrorTotal"></span></div>
        <div class="bars" id="bars" aria-hidden="true"></div>
        <div class="barlabels" id="barLabels" aria-hidden="true"></div>
        <p class="hint" id="mirrorLine"></p>
      </div>
      <input type="search" id="search" placeholder="Search everything you ever dumped" aria-label="Search">
      <div class="areas" id="areas"></div>
      <div class="spread"><h2 id="mindTitle">Strongest right now</h2><button class="ghost" id="btnVault" type="button" aria-pressed="false">Open vault</button></div>
      <div class="list" id="mindList"></div>
    </div>
  </main>

  <main id="v-ask" hidden>
    <div class="section">
      <label for="askText" class="eyebrow">Ask your own mind</label>
      <textarea id="askText" style="min-height:84px" placeholder="What do I keep circling about health? Which work ideas keep coming back?"></textarea>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="btnStop" type="button" hidden>Stop</button><button class="warm" id="btnAsk" type="button">Ask</button></div>
      <p class="err" id="askErr" role="alert" hidden></p>
      <div class="card" id="answerCard" hidden style="cursor:default">
        <p class="answer" id="answer"></p>
        <div class="acts"><button id="btnSaveAnswer" type="button">Keep as idea</button></div>
      </div>
    </div>
  </main>
</div>

<nav class="tabs" aria-label="Drawers"><div class="in">
  <button data-v="dump" aria-current="page">Dump</button>
  <button data-v="desk">Desk</button>
  <button data-v="sparks">Sparks</button>
  <button data-v="mind">Mind</button>
  <button data-v="ask">Ask</button>
</div></nav>

<div id="dropBar" hidden><button type="button" class="warm" id="btnDropBar">Drop it in</button></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheetBg" class="sheet-bg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
const AREAS=["Health","Food","Sleep","Movement","Mind","Family","People","Work","Money","Learning","Home","Meaning"];
const HUE={Health:"#E0533D",Food:"#E8902C",Sleep:"#5B6CD8",Movement:"#2FA36B",Mind:"#9156C9",Family:"#D9488C",People:"#D4A417",Work:"#2E7FC4",Money:"#3E9E9A",Learning:"#7A8F2A",Home:"#A0714B",Meaning:"#7C7C82"};
const TYPES=["idea","worry","decision","plan","question","fact","feeling","observation","insight"];
const DESK_MAX=10, SPARK_MAX=8, INBOX_SHOW=3, DAY=86400000, MAX_ATTACH=100;
let db=null,user=null,sample=null,assets=null,imgLimits=null,uid=null,root=null,ideasCol,dumpsCol,sparksCol,busyMsg="",job=null,logs=[],lastError="",diag={},perms=null,dumps=[];
let ideas=[],sparks=[],meta={},pending=[],view="dump",areaFilter=null,vaultOpen=false,vaultDumps=[],askCtl=null,lastAnswer="",deskIdx=0,busyDump=false;
const $=s=>document.querySelector(s);
function el(t,a={},...kids){const n=document.createElement(t);for(const[k,v]of Object.entries(a)){if(k==="class")n.className=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;n.append(c.nodeType?c:document.createTextNode(String(c)))}return n}
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,ms)}
function showErr(id,msg){const e=$(id);e.textContent=msg||"";e.hidden=!msg}
function ago(ts){const ms=Date.now()-ts;if(ms<3600000)return"just now";if(ms<DAY)return Math.floor(ms/3600000)+"h ago";const d=Math.floor(ms/DAY);return d===1?"yesterday":d<30?d+"d ago":new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function weight(i){
  const days=Math.max(0,(Date.now()-(i.touched||i.ts))/DAY);
  const rec=Math.pow(.5,days/21), rep=Math.min(1,(i.repeats||0)/4);
  const act=Math.min(1,(i.status==="desk"?.5:i.status==="kept"?.25:0)+(i.touches||0)*.1);
  const emo=Math.max(0,((i.energy||3)-1)/4), lk=Math.min(1,(i.links||[]).length/4);
  let w=.30*rec+.25*rep+.20*act+.15*emo+.10*lk; if(i.status==="vault")w*=.3; return w}
const live=()=>ideas.filter(i=>i.status!=="vault");
const byW=a=>[...a].sort((x,y)=>weight(y)-weight(x));
const find=id=>ideas.find(i=>i.id===id);
const refId=(map,r)=>map[String(r).replace(/[\[\]\s]/g,"")];
function errCopy(e){const c=e&&e.code;return c==="not_granted"?"Claude access was declined for this page. Reload to be asked again.":c==="rate_limited"?"Claude is busy or your usage limit is reached. Try again in a bit.":c==="refused"?"Claude declined that one. Try rewording it.":c==="session_expired"?"Sign in to Claude again, then retry.":c==="timeout"?"Claude took too long on that one.":c==="image_rejected"?"Claude could not open some of those images.":"Claude could not finish. Your words are saved as written."}
function assetURL(id){return window.PM_PLATFORM&&window.PM_PLATFORM.assetURL?window.PM_PLATFORM.assetURL(id):"/_blob/"+id}
function assetImg(id,attrs={}){const img=el("img",{alt:"Attachment",loading:"lazy",...attrs});Promise.resolve(assetURL(id)).then(u=>{if(u)img.src=u}).catch(()=>{});return img}
function assetLink(id,child){const a=el("a",{target:"_blank",rel:"noopener"},child);Promise.resolve(assetURL(id)).then(u=>{if(u)a.href=u}).catch(()=>{});return a}
function areaTag(a){return el("span",{class:"tag"},el("span",{class:"dot",style:"background:"+(HUE[a]||"#888")}),a)}

/* ---------- navigation ---------- */
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v)));
function go(v){view=v;document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ["dump","desk","sparks","mind","ask"].forEach(n=>$("#v-"+n).hidden=n!==v);renderNow();window.scrollTo(0,0)}

function ideaCard(i,actions=[]){
  const meta=el("div",{class:"meta"},el("span",{class:"tag"+(i.repeats?" warm":"")},(i.type||"note")+" · "+ago(i.ts)+(i.repeats?" · came back ×"+i.repeats:"")),el("span",{class:"row",style:"gap:10px"},(i.areas||[]).map(areaTag)));
  const ids=i.assetIds||[];
  const imgs=ids.length?el("div",{class:"thumbs"},ids.slice(0,6).map(a=>el("div",{class:"thumb"},assetImg(a))),ids.length>6?el("div",{class:"thumb",style:"display:flex;align-items:center;justify-content:center;font-weight:500"},"+"+(ids.length-6)):null):null;
  return el("article",{class:"card",tabindex:"0",onclick:()=>openIdea(i.id),onkeydown:e=>{if(e.key==="Enter")openIdea(i.id)}},meta,el("p",{class:"text"},i.text),imgs,
    actions.length?el("div",{class:"acts"},actions.map(([l,f,c])=>el("button",{type:"button",class:c||"",onclick:e=>{e.stopPropagation();f()}},l))):null)}

function render(){if(render._q)return;render._q=(window.requestAnimationFrame||setTimeout)(()=>{render._q=0;renderNow()})}
function renderNow(){
  if(uid){const t=new Date().toDateString();$("#today").textContent=ideas.filter(i=>new Date(i.ts).toDateString()===t).length+" caught today"}
  updateOrb();
  if(view==="dump")renderInbox(); if(view==="desk")renderDesk(); if(view==="sparks")renderSparks(); if(view==="mind")renderMind();
}
function renderInbox(){
  const inbox=ideas.filter(i=>i.status==="inbox").sort((a,b)=>b.ts-a.ts),box=$("#inbox");
  $("#inboxCount").textContent=inbox.length?inbox.length+" to sort":"";box.replaceChildren();renderJob();
  if(!inbox.length&&(job||$("#job").children.length))return;
  if(!inbox.length){box.append(el("div",{class:"empty"},"Nothing to sort. Each dump is cleaned into single ideas and lands here for a quick keep, desk or let go."));return}
  inbox.slice(0,INBOX_SHOW).forEach(i=>box.append(ideaCard(i,[["Keep",()=>setStatus(i.id,"kept")],["To desk",()=>setStatus(i.id,"desk"),"warm"],["Let go",()=>setStatus(i.id,"vault"),"ghost"]])));
  if(inbox.length>INBOX_SHOW)box.append(el("p",{class:"hint"},(inbox.length-INBOX_SHOW)+" more after these."));
}
function renderDesk(){
  const desk=byW(ideas.filter(i=>i.status==="desk")),f=$("#deskFocus"),m=$("#deskMini");
  $("#deskCount").textContent=desk.length+" of "+DESK_MAX;f.replaceChildren();m.replaceChildren();
  if(!desk.length){f.append(el("div",{class:"empty"},"Your desk is clear. Send ideas here from Just caught, Mind or Sparks."))}
  else{
    deskIdx=((deskIdx%desk.length)+desk.length)%desk.length;const i=desk[deskIdx];
    f.append(el("div",{class:"focus"},
      el("div",{class:"bar"}),

      el("span",{class:"small"},[(i.areas||[]).join(" · "),i.type,"first caught "+ago(i.ts),i.repeats?"came back ×"+i.repeats:null].filter(Boolean).join(" · ")),

/* ---------- one pipeline for new dumps, unfinished dumps and re-reads ----------

const TAB=Math.random().toString(36).slice(2);

async function submitDump(){

  let fullText=text;

  try{await withTimeout(dumpRef.set({ts:now,text:fullText,assetIds:[],readIds:[],textRead:!fullText,files:items.length,status:"saving"}),30000)}
  catch(e){log("save dump",e);busyDump=false;updateOrb();showErr("#dumpErr","Could not save ("+errCode(e)+"). Your words and files are still here. Tap Status to check the connection.");return}
  $("#dumpText").value="";pending.forEach(p=>p.url&&URL.revokeObjectURL(p.url));pending=[];renderPending();

  // shrink each photo once, keep the small copy on this phone, drop the original from memory
  const files=[];
  for(let k=0;k<items.length;k++){const it=items[k];
    let blob=it.blob;if(it.isImage){try{blob=await withTimeout(shrink(it.blob),15000)}catch(e){}}
    const key=dumpRef.id+":"+k+":"+(it.isImage?"i":"f");
    await local.put({key,dumpId:dumpRef.id,index:k,blob,kind:it.kind,name:it.name,isImage:it.isImage});
    files.push({key,load:async()=>blob,name:it.name,kind:it.kind,isImage:it.isImage});

async function readOne(dumpRef,d,imgs,part,parts){
  const ctx=contextList(60),canImg=imgs.length>0;
  const prompt=`You are the intake layer of a private thinking journal. The owner dumps raw thoughts, often dictated, plus screenshots, photos and doodles. Turn this dump into clean, atomic ideas.

Rules:
- Remove filler (um, uh, like, you know), false starts and repetition. Keep the owner's own voice and first person. Do not add advice, praise or facts they did not say.
- One idea per distinct thought. Usually 1-3, never more than 6. Each idea is one or two plain sentences, at most 35 words.
- type: one of ${TYPES.slice(0,8).join(", ")}.
- areas: 1-2 from exactly this list: ${AREAS.join(", ")}.
- themes: 1-3 short lowercase themes (1-2 words each).
- energy: 1-5, how charged or urgent it sounds (1 calm note, 5 strong emotion or urgency).
- echoes: refs from EXISTING IDEAS below that this idea repeats, continues or directly answers. Empty if none. Be strict.
${canImg?`- ${imgs.length} image(s) (${[...new Set(d.kinds)].join(", ")}) are attached. For a screenshot or photo, capture what it shows and why it likely mattered to the owner. For a doodle, interpret the sketch plainly. Group related images into one idea rather than one idea per image.`:""}
${parts>1?`- This is part ${part+1} of ${parts} of one large dump. Only cover what is in this part.`:""}

EXISTING IDEAS:
${ctx.text}

DUMP (${new Date(d.ts).toLocaleString()}):
${d.text||"(no text, images only)"}

Reply with only JSON: {"ideas":[{"text":"...","type":"idea","areas":["Work"],"themes":["pricing"],"energy":3,"echoes":["n4"]}]}`;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),150000);let out;
  try{out=await sample.json(prompt,{...(canImg?{images:imgs}:{}),signal:ctl.signal})}
  catch(e){throw e&&e.code==="cancelled"?{code:"timeout"}:e}
  finally{clearTimeout(tm)}
  const list=(Array.isArray(out?.ideas)?out.ideas:Array.isArray(out)?out:[]).filter(x=>x&&String(x.text||"").trim()).slice(0,6);
  if(!list.length){await saveRaw(dumpRef,d,null);return 0}
  const now=Date.now(),echoBump={};
  for(const x of list){
    const echoes=[...new Set((Array.isArray(x.echoes)?x.echoes:[]).map(r=>refId(ctx.map,r)).filter(Boolean))];
    const ref=ideasCol.doc();
    await ref.set({text:String(x.text).trim().slice(0,400),type:TYPES.includes(x.type)?x.type:"idea",
      areas:[...new Set((Array.isArray(x.areas)?x.areas:[]).filter(a=>AREAS.includes(a)))].slice(0,2),themes:(Array.isArray(x.themes)?x.themes:[]).map(String).slice(0,3),
      energy:Math.min(5,Math.max(1,Math.round(Number(x.energy))||3)),status:"inbox",ts:d.ts,touched:now,touches:0,repeats:0,links:echoes,assetIds:d.assetIds,dumpId:dumpRef.id});
    echoes.forEach(id=>(echoBump[id]=echoBump[id]||[]).push(ref.id));

  for(const[id,newIds]of Object.entries(echoBump)){const i=find(id);if(!i)continue;
    try{await ideasCol.doc(id).update({repeats:(i.repeats||0)+1,touched:now,links:[...new Set([...(i.links||[]),...newIds])].slice(-20)})}catch(e){}}
  return list.length;
}

    job={dumpId:ref.id,stage:"working",prepared:0,total:0,stored:0,failed:0,readDone:0,readTotal:0};
    const r=await runPipeline(ref,{ts:i.ts,assetIds:base.assetIds||[],readIds:[],textRead:!text},(i.assetIds||[]).map(id=>({id,load:blobLoader(id),name:"photo",kind:"image",isImage:true})),text);

async function sleepPass(){
  const kept=live().filter(i=>i.status!=="inbox");
  if(kept.length<5){toast("Keep at least 5 ideas first.");return}
  if(!sample){toast("Claude is not available on this view.");return}
  const btn=$("#btnSleep");btn.disabled=true;$("#sleepStatus").textContent="sleeping on it… (up to a minute)";
  const ctx=contextList(120);
  const recentSparks=sparks.slice(0,12).map(s=>"- "+s.text).join("\n")||"(none)";
  const prompt=`You are the overnight consolidation pass of a private thinking journal, like sleep for memory. Read the owner's ideas and surface only what is truly worth their attention. Quality over quantity: returning zero sparks is fine.

Spark kinds:
- connection: two or more ideas from DIFFERENT life areas that inform each other in a way the owner may not have seen.
- pattern: something that keeps recurring (look at "came back" counts and dates), stated plainly.
- loop: a worry or question that keeps returning with no decision or action. End with one concrete decision to make.
- question: one sharp critical-thinking question that challenges an assumption in the ideas.
Rules: at most 3 sparks; each at most 40 words, plain and specific, citing at least one ref. No praise, no therapy talk, no diagnoses or medical claims, no generic advice. Do not repeat these recent sparks:
${recentSparks}

Also pick "rising": up to 3 refs of ideas (not already on the desk) that deserve a place on the desk now.

IDEAS ([ref] type | areas | text), strongest first:
${ctx.text}

Desk now: ${ideas.filter(i=>i.status==="desk").map(i=>"- "+i.text.slice(0,80)).join("\n")||"(empty)"}

Reply with only JSON: {"sparks":[{"kind":"connection","text":"...","ideas":["n3","n17"]}],"rising":["n5"]}`;
  try{
    const out=await sample.json(prompt,{cache:false}),now=Date.now();
    const openBefore=sparks.filter(s=>s.status==="open").sort((a,b)=>b.ts-a.ts);
    const sp=(Array.isArray(out?.sparks)?out.sparks:[]).filter(s=>s&&String(s.text||"").trim()).slice(0,3);
    for(const s of sp){const ids=[...new Set((Array.isArray(s.ideas)?s.ideas:[]).map(r=>refId(ctx.map,r)).filter(Boolean))];
      await sparksCol.doc().set({kind:["connection","pattern","loop","question"].includes(s.kind)?s.kind:"spark",text:String(s.text).trim().slice(0,400),ideas:ids,status:"open",ts:now})}
    const rising=[...new Set((Array.isArray(out?.rising)?out.rising:[]).map(r=>refId(ctx.map,r)).filter(Boolean))].slice(0,3);
    await root.set({...meta,lastSleep:now,rising});
    const over=openBefore.length+sp.length-SPARK_MAX;
    if(over>0)for(const s of openBefore.slice(-over)){try{await sparksCol.doc(s.id).update({status:"archived"})}catch(e){}}
    toast(sp.length?sp.length+" new spark"+(sp.length>1?"s":""):"Nothing new worth showing tonight");
  }catch(e){toast(errCopy(e))}
  finally{btn.disabled=false;renderSparks()}
}

async function ask(){
  const q=$("#askText").value.trim();
  if(!q){showErr("#askErr","Type a question first.");return}
  if(!sample){showErr("#askErr","Claude is not available on this view.");return}
  if(!ideas.length){showErr("#askErr","Dump a few thoughts first, then ask.");return}
  const words=q.toLowerCase().split(/\W+/).filter(w=>w.length>3);
  const scored=live().map(i=>{const hay=(i.text+" "+(i.themes||[]).join(" ")+" "+(i.areas||[]).join(" ")).toLowerCase();return{i,s:words.filter(w=>hay.includes(w)).length*2+weight(i)}}).sort((a,b)=>b.s-a.s).slice(0,90);
  const map={};const lines=scored.map(({i},k)=>{map["n"+k]=i.id;return `[n${k}] ${new Date(i.ts).toLocaleDateString()} | ${i.type} | ${(i.areas||[]).join(",")} | ${String(i.text).slice(0,160)}`});
  const prompt=`You answer questions using ONLY the owner's own journal ideas below, like their own memory talking back. Be direct and specific, at most 160 words, plain sentences, no headings. Cite the ideas you use as [n#] right after the sentence. If the notes do not cover it, say so in one line. Where the notes contradict each other or an assumption looks shaky, point it out briefly. No flattery.

IDEAS:
${lines.join("\n")}

QUESTION: ${q}`;
  askCtl=new AbortController();$("#btnAsk").disabled=true;$("#btnStop").hidden=false;$("#answerCard").hidden=false;$("#answer").textContent="Thinking…";
  try{const {text}=await sample(prompt,{signal:askCtl.signal,cache:false,onText:({text})=>{$("#answer").textContent=text}});renderAnswer(text,map)}
  catch(e){if(e.code!=="cancelled")showErr("#askErr",errCopy(e));$("#answer").textContent=e.text||"";if(!e.text)$("#answerCard").hidden=true}
  finally{$("#btnAsk").disabled=false;$("#btnStop").hidden=true}
}
function renderAnswer(text,map){
  const out=$("#answer");out.replaceChildren();const order=[];
  text.split(/(\[n\d+(?:\s*,\s*n\d+)*\])/).forEach(part=>{
    if(/^\[n\d+/.test(part)){(part.match(/n\d+/g)||[]).forEach(r=>{const id=map[r];if(!id)return;let k=order.indexOf(id);if(k<0){order.push(id);k=order.length-1}
      out.append(el("sup",{class:"ref"},el("button",{type:"button","aria-label":"Open source idea "+(k+1),onclick:()=>openIdea(id)},k+1)))})}
    else out.append(document.createTextNode(part))});
  lastAnswer=text.replace(/\s*\[n\d+(?:\s*,\s*n\d+)*\]/g,"");
}
$("#btnSaveAnswer").addEventListener("click",async()=>{if(!lastAnswer||!ideasCol)return;const now=Date.now();
  try{await ideasCol.doc().set({text:lastAnswer.slice(0,600),type:"insight",areas:[],themes:[],energy:2,status:"kept",ts:now,touched:now,touches:1,repeats:0,links:[],assetIds:[]});toast("Kept as an idea")}catch(e){toast("Could not save that change.")}});

/* ---------- boot ---------- */
render();
window.__pm={get ideas(){return ideas},get sparks(){return sparks},get meta(){return meta},weight,submitDump,sleepPass,ask,setStatus,renderAnswer,go};
(async()=>{
  const C=window.claude;
  const dot=ok=>{$("#statusDot").style.background=ok?"#2FA36B":"var(--warm)"};
  const fail=m=>{$("#offlineText").textContent=m;$("#offline").hidden=false;$("#today").textContent="not connected";dot(false);log("boot: "+m,{code:"boot"})};
  $("#btnStatus").addEventListener("click",openStatus);$("#btnOfflineStatus").addEventListener("click",openStatus);
  if(!C||!C.use){fail("This copy of the page can't reach your storage. Open Pocket Mind from your artifacts in the Claude app, or at claude.ai while signed in.");return}
  [db,user,sample,assets,perms]=await Promise.all(["db","user","sample","assets","permissions"].map(n=>C.use(n).catch(()=>null)));
  diag={db:!!db,user:!!user,sample:!!sample,assets:!!assets};
  if(!db||!user){fail("Storage isn't available in this view, so dumps can't be saved. Open Pocket Mind from your artifacts in the Claude app, or at claude.ai while signed in.");return}
  uid=await user.id().catch(()=>null);
  if(!uid){fail("Sign in to Claude to use your private mind.");return}
  root=db.doc(`data/users/${uid}/mind`);ideasCol=root.collection("ideas");dumpsCol=root.collection("dumps");sparksCol=root.collection("sparks");
  if(sample){try{imgLimits=(await sample.limits())?.images||null}catch(e){imgLimits=null}}
  if(perms){try{diag.claude=await perms.state("sample")}catch(e){}}
  dot(true);log("connected · Claude "+(diag.claude||"?")+" · images "+(imgLimits?imgLimits.maxCount+"/request":"no")+" · files "+(assets?"yes":"no"));
  if(!assets&&!imgLimits)$("#btnPhoto").hidden=true;
  const onErr=e=>{log("live sync",e);fail("Lost connection to your mind. Reload the page.")};
  let firstDumps=true;dumpsCol.orderBy("ts","desc").limit(30).onSnapshot(q=>{dumps=q.docs.map(x=>({id:x.id,...x.data()}));if(view==="dump")renderJob();if(firstDumps){firstDumps=false;setTimeout(autoContinue,150)}},onErr);
  ideasCol.orderBy("ts","desc").limit(1000).onSnapshot(q=>{ideas=q.docs.map(x=>({id:x.id,...x.data()}));render()},onErr);
  sparksCol.orderBy("ts","desc").limit(60).onSnapshot(q=>{sparks=q.docs.map(x=>({id:x.id,...x.data()}));render()},onErr);
  root.onSnapshot(s=>{meta=s.exists?{...s.data()}:{};render()},onErr);
  render();
})();
</script>
